# Auto-merge Dependabot patch/minor bumps once every required check is
# green. Majors still wait for a human. Needs the repo setting
# "Allow auto-merge" enabled; branch protection (11 required checks,
# strict up-to-date) is what actually gates the merge — this only
# presses the button.
#
# The merge MUST be enabled with AUTOMERGE_PAT (a fine-grained PAT,
# contents + pull-requests write): merges attributed to GITHUB_TOKEN
# don't trigger other workflows, so ci.yml/deploy.yml never ran on the
# merge push and the box drifted (tq-health DRIFT, 2026-08-24). The
# GITHUB_TOKEN fallback keeps automerge working if the PAT is missing
# or expired — at the cost of that same silent no-deploy, which
# tq-health flags within the hour.
#
# Trigger is pull_request_target, NOT pull_request: dependabot-triggered
# pull_request runs read the *Dependabot* secrets store, where
# AUTOMERGE_PAT does not exist, so the fallback fired and PR #474
# merged as github-actions with no deploy (DRIFT, 2026-08-31).
# pull_request_target runs in the base-branch context with Actions
# secrets. Safe here because nothing checks out PR code — this job only
# reads PR metadata and presses the merge button.
#
# Pressing the button is not enough: branch protection is strict
# ("require branches to be up to date") and GitHub's auto-merge never
# updates the branch. Every merge to main leaves the other Dependabot
# PRs BEHIND, and nothing re-triggers this workflow for them, so four
# green PRs sat for days (#528–#530, #429, 2026-10-23). Hence the
# `gh pr update-branch` before the merge, and the scheduled `catch-up`
# job that updates every open Dependabot PR with auto-merge enabled.
# The update MUST also use AUTOMERGE_PAT: a branch updated with
# GITHUB_TOKEN gets no CI run (same rule as the merge), so the merge
# would wait for checks that never start.
name: dependabot-automerge

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: github.event_name == 'pull_request_target' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.meta.outputs.update-type != 'version-update:semver-major'
        run: |
          gh pr update-branch "$PR_URL" || true  # already up to date → exit 1, harmless
          gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.AUTOMERGE_PAT || secrets.GITHUB_TOKEN }}

  catch-up:
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - name: Update every open Dependabot PR that has auto-merge enabled
        run: |
          gh pr list --repo "$REPO" --author "app/dependabot" --state open \
            --json number,autoMergeRequest,mergeStateStatus \
            -q '.[] | select(.autoMergeRequest != null) | "\(.number) \(.mergeStateStatus)"' \
          | while read -r num state; do
              echo "#$num ($state)"
              gh pr update-branch "$num" --repo "$REPO" || true
            done
        env:
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.AUTOMERGE_PAT || secrets.GITHUB_TOKEN }}
