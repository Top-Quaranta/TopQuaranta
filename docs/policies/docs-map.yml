# Canonical mapping between code paths and the architecture/ops docs
# that document them. Single source of truth shared by:
#
#   - `.github/workflows/ci-docs.yml` (docs-coherence job), via
#     `scripts/check_docs_coherence.py`. Soft signal only today:
#     labels the PR `needs-docs-review`, does not block merge.
#   - A pre-commit hook (planned, FASE 2).
#
# Format chosen: YAML. Justification: the mapping is human-edited and
# benefits from per-entry comments and inline rationale (which JSON
# would force into ad-hoc `_doc` keys, as `deploy/cron-meta.json`
# already has to). YAML matches the surrounding tooling
# (`.pre-commit-config.yaml`, GitHub workflows). The CI cost is one
# `pip install pyyaml --quiet` in the docs-coherence step.
#
# # Spec: docs/policies/conventions.md

# ---------------------------------------------------------------------
mapping:
  # One doc per app. Each doc holds INVARIANTS and TRAPS only (audit
  # 2026-08-19): a change trips the gate only when it touches an app,
  # and needs a doc edit only when it changes an invariant. Everything
  # else is an override — the expected case, not the exception.
  - prefix: social/
    doc: docs/architecture/social.md
  - prefix: comptes/
    doc: docs/architecture/comptes.md
  - prefix: music/
    doc: docs/architecture/music.md
  - prefix: ranking/
    doc: docs/architecture/ranking.md
  - prefix: ingesta/
    doc: docs/architecture/ingesta.md
  - prefix: analytics/
    doc: docs/architecture/analytics.md
  - prefix: web/api/analytics_ingest.py
    doc: docs/architecture/analytics.md
  - prefix: web/
    doc: docs/architecture/web.md
  - prefix: web-react/
    doc: docs/architecture/frontend.md

  # Infrastructure + ops scripts
  - prefix: bin/
    doc: docs/ops/runbook.md
  - prefix: deploy/
    doc: docs/ops/runbook.md
  - prefix: topquaranta/
    doc: docs/ops/runbook.md

# ---------------------------------------------------------------------
# exclude: prefixes that never trip the docs-coherence check. A PR
# touching only excluded prefixes resolves to no doc and gets no
# label. Each entry must carry a `reason` so the exemption is
# auditable.
# ---------------------------------------------------------------------
exclude:
  - prefix: scripts/
    reason: >-
      Ad-hoc analysis scripts and migration helpers. No fixed
      architectural contract; accepting graveyard status until a
      piece grows enough to deserve its own doc.
  - prefix: vendor/
    reason: >-
      Design tokens vendored from the mm-design repo. Source of
      truth lives upstream; touching files here means re-vendoring,
      not changing the contract.

# ---------------------------------------------------------------------
# size: doc-size thresholds. Not enforced by a CI gate yet (FASE 2);
# centralised here so the future check has a single config to read.
#
#   threshold_lines     hard ceiling for docs under `scope`.
#   exempt_permanent    paths that never count against the ceiling.
#   grandfathered       paths that currently exceed the ceiling but
#                       are allowed temporarily until split per
#                       `docs-maintenance.md` Rule 3. Each entry
#                       names the current line count so a drift
#                       (further growth) is visible at next review.
# ---------------------------------------------------------------------
size:
  threshold_lines: 400
  scope:
    - docs/architecture/
    - docs/ops/
  exempt_permanent:
    - path: docs/history/roadmap.md
      reason: >-
        Historical sprint log. Grows by design; Rule 3 archives
        completed sprints quarterly, but the live file stays long.
  grandfathered: []
