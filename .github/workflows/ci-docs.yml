name: CI · docs

# Documentation checks that run on every push and PR. Split from
# ci.yml because they're docs-only and don't need the Python or
# Node toolchains (faster).
#
# Checks:
#   - markdownlint     — surface obvious markdown errors
#   - link-checker     — verify every link in every .md resolves
#   - spec-path        — Python `# Spec: docs/<path>.md` backlinks
#                        point to real files
#   - docs-coherence   — touches a documented subsystem without
#                        updating its doc? add needs-docs-review label

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: markdownlint-cli2
        uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          # Liberal config: surface broken-references and malformed
          # headings; don't enforce wrapped-at-80 (we don't follow that).
          globs: |
            **/*.md
            !node_modules
            !.venv
            !web-react/node_modules
            !vendor
          config: '.markdownlint.json'

  link-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: lychee link checker
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --exclude-path node_modules
            --exclude-path .venv
            --exclude-path web-react/node_modules
            --exclude-path vendor
            --exclude-path scripts/model_comparison
            './**/*.md'
          fail: true

  spec-path:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate # Spec docs backlinks
        run: python3 scripts/check_spec_paths.py

  docs-coherence:
    # Soft signal only — adds `needs-docs-review` label when a PR
    # touches a subsystem with a dedicated doc but doesn't update
    # the doc. Doesn't block merge; the PR template checkbox is
    # the canonical check.
    #
    # Mapping lives at `docs/policies/docs-map.yml` (single source
    # of truth, shared with the future pre-commit hook). Resolution
    # logic is in `scripts/check_docs_coherence.py`.
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: pip install pyyaml --quiet
      - name: Check docs vs code coupling
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          CHANGED=$(git diff --name-only "origin/$BASE_REF...HEAD" || true)
          if [ -z "$CHANGED" ]; then
            echo "No files changed."
            exit 0
          fi
          OUTPUT=$(echo "$CHANGED" | python3 scripts/check_docs_coherence.py)
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -q "^needs-docs-review$"; then
            gh pr edit "$PR_NUMBER" --add-label "needs-docs-review" || true
            echo "Added label needs-docs-review (soft signal, not a block)."
          fi
