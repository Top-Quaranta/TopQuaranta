# O3: Continuous integration for TopQuaranta.
#
# Runs on every push and pull request to main. Three checks run in parallel:
#   - tests: pytest suite + manage.py check (SQLite in-memory, no Postgres)
#   - lint:  black --check + isort --check-only
#   - migrations: detect models without a corresponding migration
#
# The repo's test settings (topquaranta.settings.test) use SQLite, so CI
# doesn't need a Postgres service. External APIs (Last.fm, Deezer) are
# mocked in tests, no network credentials needed.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Django system checks
        env:
          DJANGO_SETTINGS_MODULE: topquaranta.settings.test
        run: python manage.py check
      - name: Run pytest
        run: python -m pytest -q

  caddyfile:
    # Multi-tenant safety net: catch syntax regressions in
    # deploy/Caddyfile before they reach the server, where a bad
    # config would either fail tq-sync-infra (best case) or be
    # accepted but leave Caddy refusing to reload (worst case).
    # The `import /etc/caddy/conf.d/*.caddy` directive expands to
    # an empty set inside the container — caddy validate tolerates
    # zero matches, so we don't need to shim any cercol-api snippet
    # to make this pass.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate Caddyfile
        run: |
          docker run --rm -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2 caddy validate --adapter caddyfile --config /etc/caddy/Caddyfile

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install black + isort
        run: |
          python -m pip install --upgrade pip
          pip install black==25.1.0 isort==6.0.1
      - name: black --check
        run: black --check .
      - name: isort --check
        run: isort --check-only --diff .

  frontend-tests:
    # Vitest suite for the React SPA. Currently anchors the brand-logo
    # SVG transformation (see TopQuarantaLogo.test.js — 2026-05-07). As
    # more SPA logic gets unit-tested the suite grows here.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-react
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web-react/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: vitest
        run: npm test

  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Detect missing migrations
        env:
          DJANGO_SETTINGS_MODULE: topquaranta.settings.test
        run: python manage.py makemigrations --check --dry-run

  destructive-migrations:
    # Soft warning on PRs that introduce a destructive migration so the
    # reviewer is reminded to follow docs/ops/runbook.md §10 (kill stale
    # crons before applying). Caught 2026-05-07: dropping
    # Album.cancons_obtingudes while a 2 h 30 min MB cron held the old
    # model produced 15 'column does not exist' errors.
    #
    # Non-blocking: this job WARNS via the step summary; it doesn't fail.
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # we need PR base + head for the diff
      - name: Detect destructive operations in newly-added migrations
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -e
          # Files added in this PR under any */migrations/ directory.
          NEW=$(git diff --name-only --diff-filter=A "origin/$BASE_REF...HEAD" -- '*/migrations/*.py' || true)
          if [[ -z "$NEW" ]]; then
            echo "No new migrations in this PR."
            exit 0
          fi
          echo "New migration files in this PR:"
          echo "$NEW" | sed 's/^/  /'
          echo

          # Patterns we consider destructive. Order: most-to-least.
          DESTRUCTIVE='RemoveField|DeleteModel|RenameField|RenameModel'

          flagged=""
          while IFS= read -r f; do
            [[ -z "$f" ]] && continue
            if grep -E "operations\\.($DESTRUCTIVE)|migrations\\.($DESTRUCTIVE)" "$f" > /dev/null; then
              flagged+="$f "
              {
                echo "::warning file=$f::Destructive migration detected — see docs/ops/runbook.md §10 before deploying."
                echo "### ⚠️ Destructive migration — \`$f\`"
                echo
                grep -nE "operations\\.($DESTRUCTIVE)|migrations\\.($DESTRUCTIVE)" "$f" | sed 's/^/    /'
                echo
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          done <<< "$NEW"

          if [[ -n "$flagged" ]]; then
            echo
            echo "🟧 Destructive migration(s) flagged: $flagged"
            echo "Reviewer: confirm the deploy follows runbook §10 (kill stale crons first)."
            # Exit 0 — soft warning only.
          else
            echo "✅ No destructive operations in the new migrations."
          fi
