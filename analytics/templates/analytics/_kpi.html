{% load digest_extras %}<td width="50%" style="padding:5px;">
  <div style="background:#1c1917;border-radius:8px;padding:12px 14px;">
    <div style="font-size:11px;color:#a8a29e;line-height:1.3;">{{ label }}</div>
    <div style="font-size:22px;font-weight:500;color:#fafaf9;line-height:1.3;margin-top:2px;">
      {{ value|milers }}{% if suffix %}<span style="font-size:13px;color:#a8a29e;">{{ suffix }}</span>{% endif %}
      {% if delta and delta.moved != 'none' %}<span style="font-size:13px;color:{{ delta.color }};">{{ delta.arrow }}{% if delta.pct != None %}&nbsp;{{ delta.pct }}%{% endif %}</span>{% endif %}
    </div>
  </div>
</td>
