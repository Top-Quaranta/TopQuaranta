{% load digest_extras %}<td width="50%" valign="top" class="gridcell" style="padding:5px;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" class="card" style="background:#141319;border:1px solid rgba(255,255,255,0.10);border-radius:14px;">
    <tr><td style="padding:14px 16px;">
      <div class="muted" style="font-size:12px;color:#9aa0a6;line-height:1.3;">{{ label }}</div>
      <div class="crit" style="font-family:'Anton','Arial Black',Arial,sans-serif;font-size:30px;color:#facc15;line-height:1.05;margin-top:4px;">{{ value|milers }}{% if suffix %}<span style="font-size:15px;color:#9aa0a6;">&nbsp;{{ suffix }}</span>{% endif %}{% if delta and delta.moved != 'none' %}<span class="body-font" style="font-family:'Bricolage Grotesque','Helvetica Neue',Helvetica,Arial,sans-serif;font-size:13px;font-weight:700;color:{{ delta.color }};">&nbsp;&nbsp;{{ delta.arrow }}{% if delta.pct != None %}&nbsp;{{ delta.pct }}%{% endif %}</span>{% endif %}</div>
    </td></tr>
  </table>
</td>
