name: CI · docs

# Documentation checks that run on every push and PR. Split from
# ci.yml because they're docs-only and don't need the Python or
# Node toolchains (faster).
#
# Checks (each is its own job so branch protection can require them
# individually at FASE 3):
#   - markdownlint     surface obvious markdown errors
#   - link-checker     verify every link in every .md resolves
#   - spec-path        Python `# Spec: docs/<path>.md` backlinks point
#                      to real files
#   - docs-coherence   PR touches a documented subsystem; the doc
#                      must be in the diff OR the PR body must carry
#                      a `docs-reviewed: <doc> : <reason>` override
#   - docs-novelty     new top-level code dir must be mapped or
#                      excluded in docs-map.yml
#   - docs-size        docs inside `size.scope` must respect
#                      `threshold_lines` unless allow-listed
#
# `types` includes `edited` so re-editing the PR body to add an
# override line triggers a re-run of docs-coherence.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: markdownlint-cli2
        uses: DavidAnson/markdownlint-cli2-action@v23
        with:
          # Liberal config: surface broken-references and malformed
          # headings; don't enforce wrapped-at-80 (we don't follow that).
          globs: |
            **/*.md
            !node_modules
            !.venv
            !web-react/node_modules
            !vendor
          config: '.markdownlint.json'

  link-checker:
    # Internal-only: lychee runs with `--offline`, which makes it
    # skip every URL it cannot resolve from the local filesystem
    # (HTTP, HTTPS, mailto). Only relative links between Markdown
    # files (and absolute paths into the repo) are checked. This
    # keeps the gate deterministic: no third-party site going down
    # can fail CI. We still catch the case we actually care about
    # (`docs/foo.md` linking to `docs/bar.md` that got renamed).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: lychee link checker (offline, internal-only)
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --offline
            --no-progress
            --exclude-path node_modules
            --exclude-path .venv
            --exclude-path web-react/node_modules
            --exclude-path vendor
            './**/*.md'
          fail: true

  spec-path:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate # Spec docs backlinks
        run: python3 scripts/check_spec_paths.py

  docs-coherence:
    # FASE 2: HARD gate. A PR that touches a mapped subsystem without
    # updating its doc fails this check. Escape hatch is one or more
    # `docs-reviewed: <doc> : <reason>` lines in the PR body; the
    # check verifies (a) the doc exists on disk, (b) the doc is the
    # one the mapping resolved for the touched subsystem, (c) the
    # reason is non-empty. When the override is used the workflow
    # adds the `docs-review-skipped` label so reviewers can filter.
    #
    # `permissions.pull-requests: write` is required for the
    # `gh pr edit --add-label` calls below. The default GITHUB_TOKEN
    # has read-only PR access, which silently swallowed the label
    # writes (visible in CI logs as `'<label>' not found` because
    # the request is rejected with "Resource not accessible by
    # integration"). The label-add lines used `|| true` so the
    # check did not fail, but the audit labels never landed.
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: pip install pyyaml --quiet
      - name: Check docs vs code coupling
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          CHANGED=$(git diff --name-only "origin/$BASE_REF...HEAD" || true)
          if [ -z "$CHANGED" ]; then
            echo "No files changed."
            exit 0
          fi
          # Fetch the body fresh so the `edited` trigger sees the
          # latest version (the workflow payload caches the body at
          # PR creation time).
          PR_BODY=$(gh pr view "$PR_NUMBER" --json body -q .body)
          export PR_BODY
          set +e
          OUTPUT=$(echo "$CHANGED" | python3 scripts/check_docs_coherence.py)
          STATUS=$?
          set -e
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -q "^needs-docs-review$"; then
            gh pr edit "$PR_NUMBER" --add-label "needs-docs-review" || true
          fi
          if echo "$OUTPUT" | grep -q "^docs-review-skipped$"; then
            gh pr edit "$PR_NUMBER" --add-label "docs-review-skipped" || true
          fi
          exit $STATUS

  docs-novelty:
    # FASE 2: HARD gate. A new top-level code directory must be
    # declared in `docs/policies/docs-map.yml` either under `mapping:`
    # (with a doc) or under `exclude:` (with a reason). Catches the
    # case where a new Django app or top-level Python package
    # appears without anyone choosing whether it needs an
    # architectural doc.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: pip install pyyaml --quiet
      - name: Check for unmapped top-level code dirs
        run: python3 scripts/check_docs_novelty.py

  docs-size:
    # FASE 2: HARD gate. Docs inside `size.scope` must stay under
    # `threshold_lines` unless explicitly allow-listed under
    # `exempt_permanent` (forever) or `grandfathered` (temporary,
    # until a Rule 3 split lands).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: pip install pyyaml --quiet
      - name: Check doc sizes
        run: python3 scripts/check_docs_size.py
