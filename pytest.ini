[pytest]
# `DJANGO_SETTINGS_MODULE` pinned via `addopts = --ds=…` rather than the
# bare `DJANGO_SETTINGS_MODULE` ini key, so pytest-django can't fall
# back to an env-var-supplied production settings module when someone
# has `export DJANGO_SETTINGS_MODULE=topquaranta.settings.web_server`
# lying around in their shell. (On the Hetzner box the management
# commands are commonly invoked with that env var; if pytest happens
# to inherit it, every `APIClient` call defaults to `HTTP_HOST=
# testserver` and trips `DisallowedHost` against the prod ALLOWED_HOSTS,
# which mails admin@.)
#
# Pytest-django precedence: `--ds=` > env var > ini key. We use `--ds`.
addopts = --ds=topquaranta.settings.test
python_files = tests/test_*.py
python_classes = Test*
python_functions = test_*
